name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            HUSKY: 0
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: npm ci

            - name: Lint, format and typecheck
              run: npm run check

            - name: Build
              run: npm run build
